        <h1>WASD - 협동 파티 게임</h1>
        <p>WASD는 1~4명이 하나의 키보드로 함께 플레이하는 협동 파티 게임입니다. 각 플레이어가 W, A, S, D 키 중 하나를 맡아 캐릭터를 조종하며, 팀워크와 소통으로 스테이지를 클리어하는 것이 목표입니다.</p>

        <h2>게임 소개</h2>
        <p>WASD는 단순하지만 중독성 있는 협동 게임입니다. 하나의 캐릭터를 여러 명이 나눠 조종하기 때문에 소통과 호흡이 핵심입니다. 혼자서도 플레이할 수 있지만 친구들과 함께할 때 진정한 재미를 느낄 수 있습니다. 오프라인 모임이나 파티에서 즉석으로 즐길 수 있는 웹 기반 게임으로, 별도 설치 없이 브라우저에서 바로 시작할 수 있습니다. 닉네임만 입력하면 즉시 게임을 시작하거나 친구를 초대할 수 있습니다.</p>

        <h2>플레이 방식</h2>
        <ul>
          <li><strong>1인 모드:</strong> 혼자서 W, A, S, D 키를 모두 사용하여 캐릭터를 조종합니다. 기본적인 조작에 익숙해지기 좋은 모드입니다.</li>
          <li><strong>2인 모드:</strong> 각 플레이어가 2개의 키를 나눠 맡습니다. 예를 들어 한 명은 W와 A, 다른 한 명은 S와 D를 담당합니다.</li>
          <li><strong>3인 모드:</strong> 한 명이 2개의 키를 맡고 나머지 두 명이 각각 1개의 키를 담당합니다. 역할 분배가 중요합니다.</li>
          <li><strong>4인 모드:</strong> 각 플레이어가 정확히 1개의 키만 담당합니다. 가장 어렵고 가장 재미있는 모드로, 완벽한 팀워크가 필요합니다.</li>
        </ul>

        <h2>스테이지 구성</h2>
        <p>총 5개의 스테이지가 준비되어 있으며, 각 스테이지마다 고유한 장애물과 도전이 기다리고 있습니다. 스테이지를 진행할수록 난이도가 높아지며, 팀원 간의 협력이 더욱 중요해집니다. 모든 스테이지를 클리어하면 최종 결과 화면에서 소요 시간과 사망 횟수를 포함한 기록을 확인할 수 있습니다. 랭킹 시스템을 통해 다른 팀과 기록을 비교해 보세요.</p>

        <h2>시작하는 방법</h2>
        <p>웹 브라우저에서 wasd.aico-app.com에 접속한 뒤, 닉네임을 입력하고 '혼자 하기'를 선택하면 바로 솔로 플레이를 시작할 수 있습니다. 친구와 함께하려면 '방 만들기'를 클릭하여 방을 생성하고, 초대 코드를 친구에게 공유하세요. 친구는 초대 코드를 입력하고 '참가하기'를 누르면 합류할 수 있습니다.</p>

        <h2>자주 묻는 질문</h2>
        <dl>
          <dt>모바일에서도 플레이할 수 있나요?</dt>
          <dd>WASD는 물리 키보드가 필요한 게임이므로 데스크톱 또는 노트북 환경에서 플레이해야 합니다.</dd>
          <dt>비용이 드나요?</dt>
          <dd>완전히 무료입니다. 회원가입 없이 닉네임만 입력하면 바로 플레이할 수 있습니다.</dd>
          <dt>어떤 브라우저를 사용해야 하나요?</dt>
          <dd>Chrome, Firefox, Safari, Edge 등 최신 브라우저를 권장합니다. JavaScript가 활성화되어 있어야 합니다.</dd>
          <dt>최대 몇 명까지 함께 플레이할 수 있나요?</dt>
          <dd>최대 4명까지 하나의 키보드로 함께 플레이할 수 있습니다. 각자 W, A, S, D 키 하나씩을 담당합니다.</dd>
        </dl>

        <p>이 게임을 플레이하려면 JavaScript를 활성화해 주세요.</p>
