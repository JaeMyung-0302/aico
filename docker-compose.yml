services:
  wasd-server:
    image: ghcr.io/jaemyung-0302/wasd-server:latest
    container_name: wasd-server
    restart: unless-stopped
    ports:
      - "4002:4002"
    env_file:
      - .env.wasd
    environment:
      - NODE_ENV=production
      - PORT=4002
    networks:
      - aico-network

  cooksnap-server:
    image: ghcr.io/jaemyung-0302/cooksnap-server:latest
    container_name: cooksnap-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env.cooksnap
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://cooksnap:cooksnap@cooksnap-db:5432/cooksnap
    depends_on:
      - cooksnap-db
    networks:
      - aico-network

  cooksnap-db:
    image: postgres:16-alpine
    container_name: cooksnap-db
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=cooksnap
      - POSTGRES_PASSWORD=cooksnap
      - POSTGRES_DB=cooksnap
    volumes:
      - cooksnap-data:/var/lib/postgresql/data
    networks:
      - aico-network

  fridgemate-server:
    image: ghcr.io/jaemyung-0302/fridgemate-server:latest
    container_name: fridgemate-server
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - .env.fridgemate
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=postgresql://fridgemate:fridgemate@fridgemate-db:5432/fridgemate
    depends_on:
      - fridgemate-db
    networks:
      - aico-network

  fridgemate-db:
    image: postgres:16-alpine
    container_name: fridgemate-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=fridgemate
      - POSTGRES_PASSWORD=fridgemate
      - POSTGRES_DB=fridgemate
    volumes:
      - fridgemate-data:/var/lib/postgresql/data
    networks:
      - aico-network

  alphadeck-db:
    image: postgres:16-alpine
    container_name: alphadeck-db
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      - POSTGRES_USER=alphadeck
      - POSTGRES_PASSWORD=alphadeck
      - POSTGRES_DB=alphadeck_dev
    volumes:
      - alphadeck-data:/var/lib/postgresql/data
    networks:
      - aico-network

  geumsugangsan-db:
    image: postgres:16-alpine
    container_name: geumsugangsan-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=geumsugangsan
      - POSTGRES_PASSWORD=geumsugangsan
      - POSTGRES_DB=geumsugangsan_dev
    volumes:
      - geumsugangsan-data:/var/lib/postgresql/data
    networks:
      - aico-network

  onboard-db:
    image: postgres:16-alpine
    container_name: onboard-db
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      - POSTGRES_USER=onboard
      - POSTGRES_PASSWORD=onboard
      - POSTGRES_DB=onboard_dev
    volumes:
      - onboard-data:/var/lib/postgresql/data
    networks:
      - aico-network

networks:
  aico-network:
    driver: bridge

volumes:
  cooksnap-data:
  fridgemate-data:
  geumsugangsan-data:
  alphadeck-data:
  onboard-data:
