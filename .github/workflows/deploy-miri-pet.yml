name: Deploy Miri Pet Server

# PR: 테스트만 / main push·수동 실행: 테스트 → 이미지 빌드 → Lightsail 배포
# 필요한 GitHub 설정 (Environment `miri-pet`):
#   secrets: SERVER_HOST, SERVER_SSH_KEY, MIRI_PET_DB_PASSWORD(URL-safe, `openssl rand -hex 24`),
#            JWT_SECRET(`openssl rand -base64 48`), KAKAO_NATIVE_APP_KEY, KAKAO_ADMIN_KEY,
#            GOOGLE_WEB_CLIENT_ID, GOOGLE_IOS_CLIENT_ID, GOOGLE_ANDROID_CLIENT_ID,
#            R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, EXPO_ACCESS_TOKEN, POSTHOG_API_KEY, SENTRY_DSN
#   vars:    R2_PUBLIC_BUCKET, R2_PRIVATE_BUCKET, R2_PUBLIC_BASE_URL, POSTHOG_HOST, ENABLE_GPS_LOCATION
# 비어 있는 선택 값(POSTHOG_API_KEY, SENTRY_DSN 등)은 서버에서 no-op 처리된다
# 배포 스위치: 저장소 변수 MIRI_PET_DEPLOY_ENABLED=true 일 때만 deploy 잡이 돈다

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/miri-pet/server/**'
      - 'packages/miri-pet-shared/**'
      - '.github/workflows/deploy-miri-pet.yml'
  pull_request:
    paths:
      - 'apps/miri-pet/server/**'
      - 'packages/miri-pet-shared/**'
      - '.github/workflows/deploy-miri-pet.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-miri-pet-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: miripet
          POSTGRES_PASSWORD: miripet
          POSTGRES_DB: miripet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miripet -d miripet_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # CI 전용 일회성 DB (비밀값 아님)
      DATABASE_URL_TEST: postgresql://miripet:miripet@localhost:5432/miripet_test?schema=public
      DATABASE_URL: postgresql://miripet:miripet@localhost:5432/miripet_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @miri-pet/server...

      - name: Build shared package
        run: pnpm --filter @miri-pet/shared build

      - name: Lint
        run: pnpm --filter @miri-pet/server lint

      - name: Typecheck
        run: pnpm --filter @miri-pet/server check-types

      - name: Unit tests
        run: pnpm --filter @miri-pet/server test

      - name: Integration tests (real Postgres)
        run: pnpm --filter @miri-pet/server test:int

  deploy:
    needs: test
    # 서버·secrets 준비 전에는 저장소 변수 MIRI_PET_DEPLOY_ENABLED를 두지 않는다(테스트만 실행)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.MIRI_PET_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: miri-pet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/miri-pet/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/miri-pet-server:latest
            ghcr.io/${{ env.OWNER }}/miri-pet-server:${{ github.sha }}
          cache-from: type=gha,scope=miri-pet-server
          cache-to: type=gha,mode=max,scope=miri-pet-server

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: MIRI_PET_DB_PASSWORD,JWT_SECRET,KAKAO_NATIVE_APP_KEY,KAKAO_ADMIN_KEY,GOOGLE_WEB_CLIENT_ID,GOOGLE_IOS_CLIENT_ID,GOOGLE_ANDROID_CLIENT_ID,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_PUBLIC_BUCKET,R2_PRIVATE_BUCKET,R2_PUBLIC_BASE_URL,EXPO_ACCESS_TOKEN,POSTHOG_API_KEY,POSTHOG_HOST,SENTRY_DSN,SENTRY_RELEASE,ENABLE_GPS_LOCATION
          script: |
            set -e
            cd /app
            umask 077
            printf '%s\n' \
              "POSTGRES_USER=miripet" \
              "POSTGRES_PASSWORD=${MIRI_PET_DB_PASSWORD}" \
              "POSTGRES_DB=miripet" > .env.miri-pet-db
            printf '%s\n' \
              "DATABASE_URL=postgresql://miripet:${MIRI_PET_DB_PASSWORD}@miri-pet-db:5432/miripet?schema=public" \
              "JWT_SECRET=${JWT_SECRET}" \
              "KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}" \
              "KAKAO_ADMIN_KEY=${KAKAO_ADMIN_KEY}" \
              "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}" \
              "GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID}" \
              "GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID}" \
              "R2_ACCOUNT_ID=${R2_ACCOUNT_ID}" \
              "R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" \
              "R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" \
              "R2_PUBLIC_BUCKET=${R2_PUBLIC_BUCKET:-miripet-public}" \
              "R2_PRIVATE_BUCKET=${R2_PRIVATE_BUCKET:-miripet-private}" \
              "R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}" \
              "EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN}" \
              "POSTHOG_API_KEY=${POSTHOG_API_KEY}" \
              "POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}" \
              "SENTRY_DSN=${SENTRY_DSN}" \
              "SENTRY_RELEASE=${SENTRY_RELEASE}" \
              "ENABLE_GPS_LOCATION=${ENABLE_GPS_LOCATION:-false}" > .env.miri-pet
            docker compose pull miri-pet-server
            docker compose up -d miri-pet-db
            docker compose up -d --force-recreate miri-pet-server
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' miri-pet-server)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              docker logs --tail 100 miri-pet-server
              exit 1
            fi
            docker image prune -f
        env:
          MIRI_PET_DB_PASSWORD: ${{ secrets.MIRI_PET_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          ENABLE_GPS_LOCATION: ${{ vars.ENABLE_GPS_LOCATION }}
