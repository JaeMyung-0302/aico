name: Deploy CookSnap Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/cooksnap/server/**'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cooksnap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/cooksnap/server/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/cooksnap-server:latest

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /app
            cat > .env.cooksnap << 'ENVEOF'
            CLIENT_ORIGIN=${{ secrets.CLIENT_ORIGIN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            KAMIS_API_KEY=${{ secrets.KAMIS_API_KEY }}
            KAMIS_API_ID=${{ secrets.KAMIS_API_ID }}
            COUPANG_ACCESS_KEY=${{ secrets.COUPANG_ACCESS_KEY }}
            COUPANG_SECRET_KEY=${{ secrets.COUPANG_SECRET_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            PORTONE_STORE_ID=${{ secrets.PORTONE_STORE_ID }}
            PORTONE_API_SECRET=${{ secrets.PORTONE_API_SECRET }}
            PORTONE_CHANNEL_KEY=${{ secrets.PORTONE_CHANNEL_KEY }}
            BILLING_ENCRYPT_KEY=${{ secrets.BILLING_ENCRYPT_KEY }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            ENVEOF
            docker compose pull cooksnap-server
            docker compose up -d --force-recreate cooksnap-server cooksnap-db
            docker image prune -f
