name: Deploy CookSnap Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/cooksnap/server/**'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cooksnap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/cooksnap/server/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/cooksnap-server:latest

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CLIENT_ORIGIN,GEMINI_API_KEY,KAMIS_API_KEY,KAMIS_API_ID,COUPANG_ACCESS_KEY,COUPANG_SECRET_KEY,JWT_SECRET,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,PORTONE_STORE_ID,PORTONE_API_SECRET,PORTONE_CHANNEL_KEY,BILLING_ENCRYPT_KEY,ADMIN_EMAILS
          script: |
            cd /app
            echo "CLIENT_ORIGIN=${CLIENT_ORIGIN}" > .env.cooksnap
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env.cooksnap
            echo "KAMIS_API_KEY=${KAMIS_API_KEY}" >> .env.cooksnap
            echo "KAMIS_API_ID=${KAMIS_API_ID}" >> .env.cooksnap
            echo "COUPANG_ACCESS_KEY=${COUPANG_ACCESS_KEY}" >> .env.cooksnap
            echo "COUPANG_SECRET_KEY=${COUPANG_SECRET_KEY}" >> .env.cooksnap
            echo "JWT_SECRET=${JWT_SECRET}" >> .env.cooksnap
            echo "KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}" >> .env.cooksnap
            echo "KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}" >> .env.cooksnap
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env.cooksnap
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" >> .env.cooksnap
            echo "PORTONE_STORE_ID=${PORTONE_STORE_ID}" >> .env.cooksnap
            echo "PORTONE_API_SECRET=${PORTONE_API_SECRET}" >> .env.cooksnap
            echo "PORTONE_CHANNEL_KEY=${PORTONE_CHANNEL_KEY}" >> .env.cooksnap
            echo "BILLING_ENCRYPT_KEY=${BILLING_ENCRYPT_KEY}" >> .env.cooksnap
            echo "ADMIN_EMAILS=${ADMIN_EMAILS}" >> .env.cooksnap
            docker compose pull cooksnap-server
            docker compose up -d --force-recreate cooksnap-server cooksnap-db
            docker image prune -f
        env:
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAMIS_API_KEY: ${{ secrets.KAMIS_API_KEY }}
          KAMIS_API_ID: ${{ secrets.KAMIS_API_ID }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          PORTONE_CHANNEL_KEY: ${{ secrets.PORTONE_CHANNEL_KEY }}
          BILLING_ENCRYPT_KEY: ${{ secrets.BILLING_ENCRYPT_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
