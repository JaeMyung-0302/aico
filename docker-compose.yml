services:
  wasd-server:
    image: ghcr.io/jaemyung-0302/wasd-server:latest
    container_name: wasd-server
    restart: unless-stopped
    ports:
      - "4002:4002"
    env_file:
      - .env.wasd
    environment:
      - NODE_ENV=production
      - PORT=4002
    networks:
      - aico-network

  cooksnap-server:
    image: ghcr.io/jaemyung-0302/cooksnap-server:latest
    container_name: cooksnap-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env.cooksnap
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://cooksnap:cooksnap@cooksnap-db:5432/cooksnap
    depends_on:
      - cooksnap-db
    networks:
      - aico-network

  cooksnap-db:
    image: postgres:16-alpine
    container_name: cooksnap-db
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=cooksnap
      - POSTGRES_PASSWORD=cooksnap
      - POSTGRES_DB=cooksnap
    volumes:
      - cooksnap-data:/var/lib/postgresql/data
    networks:
      - aico-network

  fridgemate-server:
    image: ghcr.io/jaemyung-0302/fridgemate-server:latest
    container_name: fridgemate-server
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - .env.fridgemate
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=postgresql://fridgemate:fridgemate@fridgemate-db:5432/fridgemate
    depends_on:
      - fridgemate-db
    networks:
      - aico-network

  fridgemate-db:
    image: postgres:16-alpine
    container_name: fridgemate-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=fridgemate
      - POSTGRES_PASSWORD=fridgemate
      - POSTGRES_DB=fridgemate
    volumes:
      - fridgemate-data:/var/lib/postgresql/data
    networks:
      - aico-network

  alphadeck-db:
    image: postgres:16-alpine
    container_name: alphadeck-db
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      - POSTGRES_USER=alphadeck
      - POSTGRES_PASSWORD=alphadeck
      - POSTGRES_DB=alphadeck_dev
    volumes:
      - alphadeck-data:/var/lib/postgresql/data
    networks:
      - aico-network

  geumsugangsan-db:
    image: postgres:16-alpine
    container_name: geumsugangsan-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=geumsugangsan
      - POSTGRES_PASSWORD=geumsugangsan
      - POSTGRES_DB=geumsugangsan_dev
    volumes:
      - geumsugangsan-data:/var/lib/postgresql/data
    networks:
      - aico-network

  onboard-db:
    image: postgres:16-alpine
    container_name: onboard-db
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      - POSTGRES_USER=onboard
      - POSTGRES_PASSWORD=onboard
      - POSTGRES_DB=onboard_dev
    volumes:
      - onboard-data:/var/lib/postgresql/data
    networks:
      - aico-network

  # 미리펫: 비밀값은 배포 워크플로가 /app/.env.miri-pet(서버), /app/.env.miri-pet-db(POSTGRES_*)에 쓴다
  # 호스트 리버스 프록시만 붙도록 localhost 바인딩. 프록시는 /socket.io/ WebSocket Upgrade를 통과시켜야 한다
  miri-pet-server:
    image: ghcr.io/jaemyung-0302/miri-pet-server:latest
    container_name: miri-pet-server
    restart: unless-stopped
    init: true
    mem_limit: 512m
    ports:
      - "127.0.0.1:4008:4008"
    env_file:
      # 파일이 없어도 다른 앱의 compose 명령이 실패하지 않게 한다(배포 워크플로가 생성)
      - path: .env.miri-pet
        required: false
    environment:
      - NODE_ENV=production
      - PORT=4008
      - TRUST_PROXY_HOPS=2
    depends_on:
      miri-pet-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aico-network

  miri-pet-db:
    image: postgres:16-alpine
    container_name: miri-pet-db
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "127.0.0.1:5439:5432"
    env_file:
      # 파일이 없어도 다른 앱의 compose 명령이 실패하지 않게 한다(배포 워크플로가 생성)
      - path: .env.miri-pet-db
        required: false
    volumes:
      - miri-pet-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aico-network

networks:
  aico-network:
    driver: bridge

volumes:
  cooksnap-data:
  fridgemate-data:
  geumsugangsan-data:
  alphadeck-data:
  onboard-data:
  miri-pet-data:
