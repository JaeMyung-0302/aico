name: Deploy WASD Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/wasd/server/**'
      - 'packages/wasd-shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/wasd/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/wasd-server:latest

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /app
            echo "GITHUB_REPOSITORY=${{ github.repository }}" > .env
            echo "WASD_CLIENT_ORIGIN=${{ secrets.WASD_CLIENT_ORIGIN }}" >> .env
            docker compose pull wasd-server
            docker compose up -d wasd-server
            docker image prune -f
