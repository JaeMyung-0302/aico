<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neurex-viz</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #0a0a1a; }
      #app { width: 100vw; height: 100vh; }
      #status {
        position: fixed;
        top: 16px;
        left: 16px;
        color: #666;
        font-family: monospace;
        font-size: 12px;
        z-index: 10;
      }
      #phase-display {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: #888;
        font-family: monospace;
        font-size: 14px;
        z-index: 10;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">neurex-viz connecting...</div>
    <div id="phase-display"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
