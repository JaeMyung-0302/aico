# 03: 장소 탭 → 목록 → 첫 장소 상세 → "정보가 달라요" 제보
# 전제: 서버에 성수동 개발 샘플 장소가 들어 있어야 한다 (.maestro/README.md 준비 2)
appId: com.aico.miripet
name: 03 open a place and report
tags:
  - smoke
---
- runFlow: common/launch-dev.yaml
- runFlow: common/dev-login-new-user.yaml
- runFlow: common/consent-and-pet.yaml
- tapOn: 장소
- tapOn: 목록으로 보기
- extendedWaitUntil:
    visible:
      id: place-row
    timeout: 15000
- tapOn:
    id: place-row
    index: 0
- extendedWaitUntil:
    visible: 정보가 달라요 · 제보하기
    timeout: 10000
- tapOn: 정보가 달라요 · 제보하기
- extendedWaitUntil:
    visible: 대상 장소
    timeout: 10000
- scrollUntilVisible:
    element:
      id: place-report-note
    direction: DOWN
- tapOn:
    id: place-report-note
- inputText: Maestro 스모크 제보 - 운영자 무시
- hideKeyboard
- tapOn: 제보 보내기
- extendedWaitUntil:
    visible: 검수 대기 중이에요
    timeout: 10000
- tapOn: 확인
